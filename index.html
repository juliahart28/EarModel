<script>
// --- MATH CLASSES & GLOBALS ---
class Complex {
    constructor(re, im) { this.re = re; this.im = im; }
    add(c) { return new Complex(this.re + c.re, this.im + c.im); }
    sub(c) { return new Complex(this.re - c.re, this.im - c.im); }
    mul(c) { return new Complex(this.re * c.re - this.im * c.im, this.re * c.im + this.im * c.re); }
    div(c) {
        const den = c.re * c.re + c.im * c.im;
        return new Complex((this.re * c.re + this.im * c.im) / den, (this.im * c.re - this.re * c.im) / den);
    }
    mag() { return Math.sqrt(this.re * this.re + this.im * this.im); }
}

function Z_R(R) { return new Complex(R, 0); }
function Z_L(L, w) { return new Complex(0, w * L); }
function Z_C(C, w) { 
    w = Math.max(w, 1e-10); // Ultimate fail-safe to prevent divide-by-zero
    return new Complex(0, -1 / (w * C)); 
}
function parallel(z1, z2) { return (z1.mul(z2)).div(z1.add(z2)); }
function polar(r, theta) { return new Complex(r * Math.cos(theta), r * Math.sin(theta)); }

const C = 343.0; // Speed of sound
const HEAD_RADIUS = 0.0875; // Average human head radius (m)

// Setup FFT Parameters for HRIR
const Fs = 44100;
const N = 1024; // Linear Bins for IFFT
const df = Fs / N;

// Web Audio API Globals
let audioCtx = null;
let currentSource = null;
let convolver = null;
let gainNode = null; // New node for boosting volume!
let decodedAudioBuffer = null;
let currentHRIR_L = new Float32Array(N);
let currentHRIR_R = new Float32Array(N);

// Radix-2 Inverse FFT
function ifft1D(re, im) {
    let N = re.length;
    let m = Math.log2(N);
    let j = 0, k, tRe, tIm;
    for (let i = 0; i < N - 1; i++) {
        if (i < j) {
            tRe = re[j]; re[j] = re[i]; re[i] = tRe;
            tIm = im[j]; im[j] = im[i]; im[i] = tIm;
        }
        k = N / 2;
        while (k <= j) { j -= k; k /= 2; }
        j += k;
    }
    let n1 = 1, n2 = 1, a, c, s;
    for (let i = 0; i < m; i++) {
        n1 = n2; n2 += n2;
        a = 0;
        for (j = 0; j < n1; j++) {
            c = Math.cos(2 * Math.PI * a / N);
            s = Math.sin(2 * Math.PI * a / N);
            a += 1 << (m - i - 1);
            for (k = j; k < N; k += n2) {
                tRe = c * re[k + n1] - s * im[k + n1];
                tIm = s * re[k + n1] + c * im[k + n1];
                re[k + n1] = re[k] - tRe;
                im[k + n1] = im[k] - tIm;
                re[k] += tRe;
                im[k] += tIm;
            }
        }
    }
    for (let i = 0; i < N; i++) { re[i] /= N; im[i] /= N; }
    return re; 
}

// Log spaced frequency array (Your original loop array)
const numPoints = 500;
const f = Array.from({length: numPoints}, (_, i) => 
    Math.pow(10, Math.log10(100) + i * (Math.log10(20000) - Math.log10(100)) / (numPoints - 1))
);

// --- COMPLEX HRTF CALCULATION ---
function calcComplexHRTF(freq, p) {
    freq = Math.max(freq, 1e-3); // Prevent divide by zero error here!
    let w = 2 * Math.PI * freq;
    
    // 1. Canal
    let k_wave = w / C;
    let damping = 0.0014 / p.diam;
    let H_canal = (new Complex(1, 0)).div(new Complex(Math.cos(k_wave * p.length), damping * Math.sin(k_wave * p.length)));

    // 2. Cavity
    let r_aper = Math.sqrt(p.aper / Math.PI);
    let L_eff = p.cdepth + 0.85 * r_aper;
    let fh = (C / (2 * Math.PI)) * Math.sqrt(p.aper / (p.vol * L_eff));
    let H_cav = new Complex(1,0);
    if(fh > 0) {
        let w_ratio = Math.max(freq / fh, 1e-10);
        H_cav = (new Complex(1, 0)).add((new Complex(1.5, 0)).div(new Complex(1, 3.0 * (w_ratio - 1/w_ratio))));
    }

    // 3. Reflector
    let f_cut = C / p.refgeom;
    let H_ref = new Complex(1 + 1.5 * (Math.pow(freq, 2) / (Math.pow(f_cut, 2) + Math.pow(freq, 2))), 0);

    // 4. Middle Ear
    let Cp = 5.1e-6, La = 14e-3, Ra = 10, Rm = 390;
    let Rd1 = 200, Cd1 = 0.8e-6, Ld = 15e-3, Cd2 = 0.4e-6, Rd2 = 220, Rd3 = 5900, Cd3 = 0.2e-6;
    let Co = 1.4e-6, Lo = 40e-3, Ro = 70, Cs = 0.25e-6, Rs = 3000;
    let Cc = 0.6e-6, Lc = 45e-3, Rc = 550;
    let Ct = (p.cav_vol_cm3 / 0.5) * 0.35e-6; 

    let z_cav_branch = Z_C(Cp, w).add(Z_L(La, w)).add(Z_R(Ra));
    let Z_cavity = parallel(parallel(z_cav_branch, Z_R(Rm)), Z_C(Ct, w));
    let z_d3 = parallel(Z_R(Rd3), Z_C(Cd3, w));
    let z_d2 = Z_C(Cd2, w).add(Z_R(Rd2));
    let z_drum_p = parallel(Z_L(Ld, w), z_d2.add(z_d3));
    let Z_eardrum_loss = Z_R(Rd1).add(Z_C(Cd1, w)).add(z_drum_p);
    let Z_ossicles = Z_C(Co, w).add(Z_L(Lo, w)).add(Z_R(Ro));
    let Z_joint = Z_C(Cs, w).add(Z_R(Rs));
    let Z_cochlea = Z_C(Cc, w).add(Z_L(Lc, w)).add(Z_R(Rc));
    let Z_load = parallel(Z_joint, Z_cochlea);
    let Z_branch2 = Z_ossicles.add(Z_load);
    let Z_total = Z_cavity.add(parallel(Z_eardrum_loss, Z_branch2));

    let V_branch2_ratio = parallel(Z_eardrum_loss, Z_branch2).div(Z_total);
    let V_cochlea_ratio = Z_load.div(Z_branch2);
    let H_middle = V_branch2_ratio.mul(V_cochlea_ratio).mul(new Complex(Math.pow(10, p.me_gain/20), 0));

    // Combine Mono
    let H_mono = H_canal.mul(H_cav).mul(H_ref).mul(H_middle);

    // 5. Binaural ITD, ILD & Pinna
    let azim_rad = p.azim * Math.PI / 180;
    let itd_R = 0, itd_L = 0;
    if (p.azim > 0) { itd_L = (HEAD_RADIUS / C) * (azim_rad + Math.sin(azim_rad)); } 
    else { itd_R = (HEAD_RADIUS / C) * (Math.abs(azim_rad) + Math.sin(Math.abs(azim_rad))); }

    let f_shadow = Math.min(freq / 3000, 1.0);
    let ild_R = 0, ild_L = 0;
    if (p.azim > 0) {
        ild_R = 5 * Math.sin(azim_rad) * f_shadow; 
        ild_L = -20 * Math.sin(azim_rad) * f_shadow;
    } else {
        ild_R = -20 * Math.abs(Math.sin(azim_rad)) * f_shadow;
        ild_L = 5 * Math.abs(Math.sin(azim_rad)) * f_shadow;
    }

    let a_R = 1.0 - 0.005 * p.elev + 0.002 * p.azim;
    let a_L = 1.0 - 0.005 * p.elev - 0.002 * p.azim;
    let d_p_R = (p.path * a_R) / C;
    let d_p_L = (p.path * a_L) / C;

    let H_pinna_R = (new Complex(1, 0)).add(polar(p.strength, -2 * Math.PI * freq * d_p_R));
    let H_pinna_L = (new Complex(1, 0)).add(polar(p.strength, -2 * Math.PI * freq * d_p_L));

    let H_L = H_mono.mul(H_pinna_L).mul(polar(Math.pow(10, ild_L/20), -2 * Math.PI * freq * itd_L));
    let H_R = H_mono.mul(H_pinna_R).mul(polar(Math.pow(10, ild_R/20), -2 * Math.PI * freq * itd_R));

    return { H_L, H_R };
}
// --- MAIN UPDATE FUNCTION ---
function updateApp() {
    const azim = parseFloat(document.getElementById('s_azim').value);
    const elev = parseFloat(document.getElementById('s_elev').value);
    const length = parseFloat(document.getElementById('s_len').value);
    const diam = parseFloat(document.getElementById('s_diam').value);
    const vol = parseFloat(document.getElementById('s_vol').value);
    const aper = parseFloat(document.getElementById('s_aper').value);
    const cdepth = parseFloat(document.getElementById('s_cdepth').value);
    const refgeom = parseFloat(document.getElementById('s_refgeom').value);
    const path = parseFloat(document.getElementById('s_path').value);
    const strength = parseFloat(document.getElementById('s_strength').value);
    
    const area_ed = parseFloat(document.getElementById('s_area_ed').value);
    const area_fp = parseFloat(document.getElementById('s_area_fp').value);
    const cav_vol_cm3 = parseFloat(document.getElementById('s_cav_vol').value);
    const malleus_len = parseFloat(document.getElementById('s_malleus').value);
    const incus_len = parseFloat(document.getElementById('s_incus').value);
    const stapes_len = parseFloat(document.getElementById('s_stapes').value);

    document.getElementById('val_azim').innerText = azim;
    document.getElementById('val_elev').innerText = elev;
    document.getElementById('val_len').innerText = length.toFixed(4);
    document.getElementById('val_diam').innerText = diam.toFixed(4);
    document.getElementById('val_vol').innerText = vol.toExponential(1);
    document.getElementById('val_aper').innerText = aper.toExponential(1);
    document.getElementById('val_cdepth').innerText = cdepth.toFixed(4);
    document.getElementById('val_refgeom').innerText = refgeom.toFixed(4);
    document.getElementById('val_path').innerText = path.toFixed(4);
    document.getElementById('val_strength').innerText = strength.toFixed(2);
    document.getElementById('val_area_ed').innerText = area_ed.toFixed(1);
    document.getElementById('val_area_fp').innerText = area_fp.toFixed(1);
    document.getElementById('val_cav_vol').innerText = cav_vol_cm3.toFixed(2);
    document.getElementById('val_malleus').innerText = malleus_len.toFixed(1);
    document.getElementById('val_incus').innerText = incus_len.toFixed(1);
    document.getElementById('val_stapes').innerText = stapes_len.toFixed(1);
    
    let areal_gain = 20 * Math.log10(area_ed / area_fp);
    let lever_gain = 20 * Math.log10(malleus_len / incus_len);
    let me_transformer_gain = areal_gain + lever_gain;

    let pObj = {
        length: length, diam: diam, aper: aper, cdepth: cdepth, vol: vol, refgeom: refgeom, 
        cav_vol_cm3: cav_vol_cm3, me_gain: me_transformer_gain, azim: azim, elev: elev, path: path, strength: strength
    };

    // Calculate Data for Log-Scale Plots
    let mag_total_L = [], mag_total_R = [], mag_combined_L = [], mag_combined_R = [], mag_middle = [], ild_plot_array = [];
    
    for (let i = 0; i < f.length; i++) {
        let freq = f[i];
        let { H_L, H_R } = calcComplexHRTF(freq, pObj);
        
        let m_L = 20 * Math.log10(H_L.mag());
        let m_R = 20 * Math.log10(H_R.mag());
        
        mag_combined_L.push(m_L);
        mag_combined_R.push(m_R);
        ild_plot_array.push(m_R - m_L);
    }

    // Calculate Linear IFFT Data
    let reL = new Float32Array(N), imL = new Float32Array(N);
    let reR = new Float32Array(N), imR = new Float32Array(N);

    for (let k = 0; k <= N/2; k++) {
        let f_lin = k * df;
        let { H_L, H_R } = calcComplexHRTF(f_lin, pObj);
        reL[k] = H_L.re; imL[k] = H_L.im;
        reR[k] = H_R.re; imR[k] = H_R.im;
        
        if (k > 0 && k < N/2) {
            reL[N-k] = H_L.re; imL[N-k] = -H_L.im;
            reR[N-k] = H_R.re; imR[N-k] = -H_R.im;
        }
    }
    imL[0] = 0; imR[0] = 0; imL[N/2] = 0; imR[N/2] = 0; 

    // Inverse FFT
    currentHRIR_L = ifft1D(reL, imL);
    currentHRIR_R = ifft1D(reR, imR);

    // Update Live Audio Buffer
    if(convolver && audioCtx) {
        let hrirBuffer = audioCtx.createBuffer(2, N, audioCtx.sampleRate);
        hrirBuffer.copyToChannel(currentHRIR_L, 0);
        hrirBuffer.copyToChannel(currentHRIR_R, 1);
        convolver.buffer = hrirBuffer;
    }

    // Prepare Plotly HRIR Time Data
    let t_plot = [], hrirL_plot = [], hrirR_plot = [];
    for(let i=0; i<256; i++) { 
        t_plot.push((i / Fs) * 1000); 
        hrirL_plot.push(currentHRIR_L[i]);
        hrirR_plot.push(currentHRIR_R[i]);
    }

    // Stats Box
    let azim_rad_stat = azim * Math.PI / 180;
    let est_itd = (HEAD_RADIUS / C) * (Math.abs(azim_rad_stat) + Math.sin(Math.abs(azim_rad_stat))) * 1000;
    document.getElementById('stats_box').innerHTML = `
        <strong>Estimated Spatial Cues:</strong><br>
        • ITD (Time Diff): ${est_itd.toFixed(2)} ms<br>
        • Total Middle Ear Gain: ${me_transformer_gain.toFixed(1)} dB
    `;

    // Draw Plotly Graphs
    Plotly.newPlot('chart', [
        { x: f, y: mag_combined_L, mode: 'lines', name: 'Left Ear (Combined)', line: {color: '#2980b9', width: 3} },
        { x: f, y: mag_combined_R, mode: 'lines', name: 'Right Ear (Combined)', line: {color: '#c0392b', width: 3} }
    ], {
        title: 'Binaural Transfer Function (HRTF)', xaxis: { type: 'log', title: 'Frequency (Hz)', range: [2, Math.log10(20000)] }, yaxis: { title: 'Magnitude (dB)', range: [-40, 60] }, margin: { l: 50, r: 20, t: 50, b: 50 }, hovermode: 'closest', legend: { orientation: 'h', yanchor: 'top', y: -0.15, xanchor: 'center', x: 0.5 }
    }, {responsive: true});

    Plotly.newPlot('chart_ild', [
        { x: f, y: ild_plot_array, mode: 'lines', name: 'ILD (R - L)', fill: 'tozeroy', line: {color: '#27ae60'} }
    ], {
        title: 'Interaural Level Difference (Head Shadowing)', xaxis: { type: 'log', title: 'Frequency (Hz)', range: [2, Math.log10(20000)] }, yaxis: { title: 'ILD (dB)', range: [-30, 30] }, margin: { l: 50, r: 20, t: 40, b: 40 }
    }, {responsive: true});

    Plotly.newPlot('chart_hrir', [
        { x: t_plot, y: hrirL_plot, mode: 'lines', name: 'Left HRIR', line: {color: '#2980b9'} },
        { x: t_plot, y: hrirR_plot, mode: 'lines', name: 'Right HRIR', line: {color: '#c0392b', dash:'dot'} }
    ], {
        title: 'Synthetic Impulse Response (HRIR)', xaxis: { title: 'Time (ms)' }, yaxis: { title: 'Amplitude' }, margin: { l: 50, r: 20, t: 40, b: 40 }
    }, {responsive: true});
}
// Attach listeners
document.querySelectorAll('input[type="range"]').forEach(slider => {
    slider.addEventListener('input', updateApp);
});

// Audio Rendering Logic
document.getElementById('audio_file').addEventListener('change', function(e) {
    if (!audioCtx) { 
        audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        convolver = audioCtx.createConvolver(); 
        gainNode = audioCtx.createGain(); // Initialize the Gain Node
        gainNode.gain.value = 15.0; // Boost the final audio by 15x
    }
    let reader = new FileReader();
    reader.onload = function(ev) {
        audioCtx.decodeAudioData(ev.target.result, function(buffer) {
            decodedAudioBuffer = buffer;
            document.getElementById('btn_play').innerText = "Play Binaural Audio";
        });
    };
    reader.readAsArrayBuffer(e.target.files[0]);
});

document.getElementById('btn_play').addEventListener('click', function() {
    if(!decodedAudioBuffer) { alert("Please upload an audio file first."); return; }
    if(currentSource) { currentSource.stop(); }
    
    let hrirBuffer = audioCtx.createBuffer(2, N, audioCtx.sampleRate);
    hrirBuffer.copyToChannel(currentHRIR_L, 0);
    hrirBuffer.copyToChannel(currentHRIR_R, 1);
    convolver.buffer = hrirBuffer;

    currentSource = audioCtx.createBufferSource();
    currentSource.buffer = decodedAudioBuffer;
    currentSource.loop = true;
    
    // Wire up the new signal path: Source -> Convolver -> GAIN BOOST -> Destination
    currentSource.connect(convolver);
    convolver.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    currentSource.start();
    document.getElementById('btn_stop').style.display = 'block';
});

document.getElementById('btn_stop').addEventListener('click', function() {
    if(currentSource) { currentSource.stop(); currentSource = null; }
    this.style.display = 'none';
});

// Run once on load
updateApp();
</script>
