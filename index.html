<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binaural HRTF & Middle Ear Acoustic Model</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px; }
        .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 300px; max-height: 95vh; overflow-y: auto;}
        .plot-area { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 2; min-width: 600px; }
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 0.9em; font-weight: bold; margin-bottom: 5px; }
        input[type="range"] { width: 100%; }
        h2 { margin-top: 0; font-size: 1.2em; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .stats { margin-top: 20px; padding: 15px; background: #eef2f5; border-radius: 6px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h2>Spatial Location (HRTF)</h2>
        <div class="slider-group">
            <label>Azimuth (deg) [Left < 0 > Right] <span id="val_azim">0</span></label>
            <input type="range" id="s_azim" min="-90" max="90" step="1" value="0">
        </div>
        <div class="slider-group">
            <label>Elevation (deg) <span id="val_elev">0</span></label>
            <input type="range" id="s_elev" min="-45" max="90" step="1" value="0">
        </div>

        <h2 style="margin-top: 30px;">Outer Ear Parameters</h2>
        <div class="slider-group">
            <label>Canal Length (m) <span id="val_len">0.0250</span></label>
            <input type="range" id="s_len" min="0.015" max="0.035" step="0.001" value="0.025">
        </div>
        <div class="slider-group">
            <label>Canal Diameter (m) <span id="val_diam">0.0070</span></label>
            <input type="range" id="s_diam" min="0.005" max="0.012" step="0.0001" value="0.007">
        </div>
        <div class="slider-group">
            <label>Concha Volume (m³) <span id="val_vol">4.0e-6</span></label>

        </div>
        <div class="slider-group">
            <label>Concha Aperture (m²) <span id="val_aper">3.5e-4</span></label>
            <input type="range" id="s_aper" min="1e-4" max="10e-4" step="1e-5" value="3.5e-4">
        </div>
        <div class="slider-group">
            <label>Concha Depth (m) <span id="val_cdepth">0.0150</span></label>
            <input type="range" id="s_cdepth" min="0.005" max="0.03" step="0.001" value="0.015">
        </div>
        <div class="slider-group">
            <label>Reflector Depth (m) <span id="val_refgeom">0.0300</span></label>
            <input type="range" id="s_refgeom" min="0.01" max="0.06" step="0.001" value="0.03">
        </div>
        <div class="slider-group">
            <label>Pinna Base Path (m) <span id="val_path">0.0400</span></label>
            <input type="range" id="s_path" min="0.01" max="0.1" step="0.001" value="0.04">
        </div>
        <div class="slider-group">
            <label>Reflect Strength <span id="val_strength">0.60</span></label>
            <input type="range" id="s_strength" min="0.1" max="0.9" step="0.01" value="0.6">
        </div>
        
        <h2 style="margin-top: 30px;">Middle Ear Parameters</h2>
        <div class="slider-group">
            <label>Eardrum Area (mm²) <span id="val_area_ed">81.0</span></label>
            <input type="range" id="s_area_ed" min="40" max="120" step="0.5" value="81">
        </div>
        <div class="slider-group">
            <label>Footplate Area (mm²) <span id="val_area_fp">3.0</span></label>
            <input type="range" id="s_area_fp" min="1" max="6" step="0.1" value="3.0">
        </div>
        <div class="slider-group">
            <label>Tympanic Cavity Vol (cm³) <span id="val_cav_vol">0.50</span></label>
            <input type="range" id="s_cav_vol" min="0.05" max="1.5" step="0.05" value="0.5">
        </div>

        <h3 style="font-size: 1em; margin-top: 15px; border-bottom: 1px solid #eee;">Ossicular Chain Lengths</h3>
        <div class="slider-group">
            <label>Malleus Length (mm) <span id="val_malleus">8.0</span></label>
            <input type="range" id="s_malleus" min="4" max="12" step="0.1" value="8.0">
        </div>
        <div class="slider-group">
            <label>Incus Length (mm) <span id="val_incus">6.0</span></label>
            <input type="range" id="s_incus" min="3" max="10" step="0.1" value="6.0">
        </div>
        <div class="slider-group">
            <label>Stapes Length (mm) <span id="val_stapes">3.0</span></label>
            <input type="range" id="s_stapes" min="1.5" max="5.0" step="0.1" value="3.0">
        </div>

        <div class="stats" id="stats_box">
            Loading physics data...
        </div>
    </div>

    <div class="plot-area">
        <!-- Acoustic Anatomy Reference Graphic -->
        <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            <h3 style="margin-top: 0; color: #333; font-size: 1.1em; border-bottom: none;">Acoustic Model Geometry Reference</h3>
            <svg width="100%" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" style="max-width: 750px; font-family: sans-serif;">
                <defs>
                    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
                        <path d="M0,2 L0,8 L9,5 z" fill="#666" />

                        <path d="M9,2 L9,8 L0,5 z" fill="#666" />
                    </marker>
                </defs>

                <!-- Background Highlights -->
                <rect x="380" y="120" width="180" height="80" fill="#f4f8fb" />
                <path d="M 280 70 Q 350 90 380 120 L 380 200 Q 350 230 280 250 Q 240 160 280 70" fill="#fdfaf4" />

                <!-- Ear Canal -->
                <path d="M 380 120 L 560 120" stroke="#2c3e50" stroke-width="4" fill="none" />
                <path d="M 380 200 L 560 200" stroke="#2c3e50" stroke-width="4" fill="none" />

                <!-- Concha Cavity -->
                <path d="M 280 70 Q 350 90 380 120" stroke="#2c3e50" stroke-width="4" fill="none" />
                <path d="M 280 250 Q 350 230 380 200" stroke="#2c3e50" stroke-width="4" fill="none" />
                <path d="M 280 70 Q 230 160 280 250" stroke="#2c3e50" stroke-width="3" fill="none" stroke-dasharray="6,4" />

                <!-- Tympanic Membrane -->
                <line x1="560" y1="115" x2="575" y2="205" stroke="#e74c3c" stroke-width="4" />

                <!-- Ossicles -->
                <!-- Malleus -->
                <line x1="568" y1="160" x2="595" y2="125" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round" />
                <circle cx="595" cy="125" r="4" fill="#7f8c8d" />

                <!-- Incus -->
                <path d="M 595 125 Q 615 120 620 145" stroke="#95a5a6" stroke-width="4" fill="none" stroke-linecap="round" />

                <!-- Stapes -->
                <path d="M 620 145 L 635 140 L 635 160 L 620 155 Z" stroke="#bdc3c7" stroke-width="2" fill="none" />
                <rect x="635" y="138" width="4" height="24" fill="#bdc3c7" />

                <!-- Cochlea -->
                <circle cx="659" cy="150" r="20" stroke="#3498db" stroke-width="3" fill="#ebf5fb" />

                <!-- ANNOTATIONS -->
                <!-- Pinna Path / Reflector -->
                <line x1="120" y1="160" x2="270" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)" />
                <text x="195" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Reflector Depth</text>
                <text x="195" y="175" text-anchor="middle" font-size="10" fill="#666">Pinna Base Path</text>

                <!-- Concha Dimensions -->
                <line x1="280" y1="160" x2="380" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)" />
                <text x="330" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Concha Depth</text>
                <text x="330" y="175" text-anchor="middle" font-size="10" fill="#666">Vol &amp; Aperture</text>

                <!-- Canal Length -->
                <line x1="380" y1="230" x2="565" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)" />
                <text x="472" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Canal Length</text>
                <line x1="380" y1="205" x2="380" y2="235" stroke="#aaa" stroke-width="1" />
                <line x1="565" y1="205" x2="565" y2="235" stroke="#aaa" stroke-width="1" />

                <!-- Canal Diameter -->
                <line x1="472" y1="120" x2="472" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-rev)" />
                <rect x="480" y="148" width="80" height="24" fill="white" opacity="0.8" />
                <text x="485" y="165" font-size="12" fill="#333" font-weight="bold">Canal Diam</text>

                <!-- Middle Ear Labels -->
                <text x="545" y="95" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">Tympanic</text>
                <text x="545" y="108" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">Membrane</text>
                <line x1="545" y1="112" x2="563" y2="140" stroke="#e74c3c" stroke-width="1" />

                <text x="595" y="95" text-anchor="middle" font-size="11" fill="#7f8c8d" font-weight="bold">Malleus</text>
                <line x1="595" y1="100" x2="590" y2="115" stroke="#7f8c8d" stroke-width="1" />

                <text x="635" y="95" text-anchor="middle" font-size="11" fill="#95a5a6" font-weight="bold">Incus</text>
                <line x1="635" y1="100" x2="610" y2="125" stroke="#95a5a6" stroke-width="1" />

                <text x="625" y="185" text-anchor="middle" font-size="11" fill="#7f8c8d" font-weight="bold">Stapes</text>
                <line x1="625" y1="175" x2="625" y2="155" stroke="#7f8c8d" stroke-width="1" />
                
                <text x="675" y="115" text-anchor="middle" font-size="12" fill="#3498db" font-weight="bold">Cochlea</text>
            </svg>
        </div>

        <div id="chart" style="width:100%; height:600px;"></div>
    </div>
</div>

<script>
    class Complex {
    constructor(re, im) {
        this.re = re;
        this.im = im;
    }
    add(c) { return new Complex(this.re + c.re, this.im + c.im); }
    sub(c) { return new Complex(this.re - c.re, this.im - c.im); }
    mul(c) { return new Complex(this.re * c.re - this.im * c.im, this.re * c.im + this.im * c.re); }
    div(c) {
        const den = c.re * c.re + c.im * c.im;
        return new Complex((this.re * c.re + this.im * c.im) / den, (this.im * c.re - this.re * c.im) / den);
    }
    mag() { return Math.sqrt(this.re * this.re + this.im * this.im); }
}

function Z_R(R) { return new Complex(R, 0); }
function Z_L(L, w) { return new Complex(0, w * L); }
function Z_C(C, w) { return new Complex(0, -1 / (w * C)); }
function parallel(z1, z2) { return (z1.mul(z2)).div(z1.add(z2)); }

const C = 343.0; // Speed of sound

const numPoints = 500;
const f = Array.from({length: numPoints}, (_, i) => 
    Math.pow(10, Math.log10(100) + i * (Math.log10(20000) - Math.log10(100)) / (numPoints - 1))
);

function updateApp() {
    // Spatial Values
    const azim = parseFloat(document.getElementById('s_azim').value);
    const elev = parseFloat(document.getElementById('s_elev').value);

    // Outer Ear values
    const length = parseFloat(document.getElementById('s_len').value);
    const diam = parseFloat(document.getElementById('s_diam').value);
    const vol = parseFloat(document.getElementById('s_vol').value);
    const aper = parseFloat(document.getElementById('s_aper').value);
    const cdepth = parseFloat(document.getElementById('s_cdepth').value);
    const refgeom = parseFloat(document.getElementById('s_refgeom').value);
    const path = parseFloat(document.getElementById('s_path').value);
    const strength = parseFloat(document.getElementById('s_strength').value);
    
    // Middle Ear Areas & Volume
    const area_ed = parseFloat(document.getElementById('s_area_ed').value);
    const area_fp = parseFloat(document.getElementById('s_area_fp').value);
    const cav_vol_cm3 = parseFloat(document.getElementById('s_cav_vol').value);

    // Ossicular Lengths
    const malleus_len = parseFloat(document.getElementById('s_malleus').value);
    const incus_len = parseFloat(document.getElementById('s_incus').value);
    const stapes_len = parseFloat(document.getElementById('s_stapes').value);

    // Update UI text labels
    document.getElementById('val_azim').innerText = azim;
    document.getElementById('val_elev').innerText = elev;

    document.getElementById('val_len').innerText = length.toFixed(4);
    document.getElementById('val_diam').innerText = diam.toFixed(4);
    document.getElementById('val_vol').innerText = vol.toExponential(1);
    document.getElementById('val_aper').innerText = aper.toExponential(1);
    document.getElementById('val_cdepth').innerText = cdepth.toFixed(4);
    document.getElementById('val_refgeom').innerText = refgeom.toFixed(4);
    document.getElementById('val_path').innerText = path.toFixed(4);
    document.getElementById('val_strength').innerText = strength.toFixed(2);
    
    document.getElementById('val_area_ed').innerText = area_ed.toFixed(1);
    document.getElementById('val_area_fp').innerText = area_fp.toFixed(1);
    document.getElementById('val_cav_vol').innerText = cav_vol_cm3.toFixed(2);
    
    document.getElementById('val_malleus').innerText = malleus_len.toFixed(1);
    document.getElementById('val_incus').innerText = incus_len.toFixed(1);
    document.getElementById('val_stapes').innerText = stapes_len.toFixed(1);
    
    // --- CALCULATE MIDDLE EAR TRANSFORMER GAIN ---
    let areal_gain = 20 * Math.log10(area_ed / area_fp);
    let lever_gain = 20 * Math.log10(malleus_len / incus_len);
    let me_transformer_gain = areal_gain + lever_gain;

    // Output Arrays
    let mag_total_L = [], mag_total_R = [];
    let mag_combined_L = [], mag_combined_R = [];
    let mag_middle = [];
    let fh = 0;

    for (let i = 0; i < f.length; i++) {
        let freq = f[i];
        
        // --- 1. COMMON OUTER EAR (Symmetric parts) ---
        let k = 2 * Math.PI * freq / C;
        let damping = 0.0014 / diam;
        let mag_c = 20 * Math.log10(1.0 / Math.sqrt(Math.pow(Math.cos(k * length), 2) + Math.pow(damping * Math.sin(k * length), 2)));

        let r_aper = Math.sqrt(aper / Math.PI);
        let L_eff = cdepth + 0.85 * r_aper;
        fh = (C / (2 * Math.PI)) * Math.sqrt(aper / (vol * L_eff));
        let w_ratio = freq / fh;
        let Q = 3.0;
        let mag_cav = 20 * Math.log10(1.0 + (1.5 / Math.sqrt(1 + Math.pow(Q, 2) * Math.pow(w_ratio - 1/w_ratio, 2))));

        let f_cut = C / refgeom;
        let mag_ref = 20 * Math.log10(1.0 + 1.5 * (Math.pow(freq, 2) / (Math.pow(f_cut, 2) + Math.pow(freq, 2))));

        // --- 2. BINAURAL PINNA REFLECTIONS ---
        // Azimuth shifts the notch up or down depending on the ear
        let angle_mod_R = 1.0 - 0.005 * elev + 0.002 * azim;
        let angle_mod_L = 1.0 - 0.005 * elev - 0.002 * azim;

        let delay_R = (path * angle_mod_R) / C;
        let delay_L = (path * angle_mod_L) / C;

        let theta_p_R = -2 * Math.PI * freq * delay_R;
        let theta_p_L = -2 * Math.PI * freq * delay_L;

        let mag_p_R = 20 * Math.log10(Math.sqrt(1 + Math.pow(strength, 2) + 2 * strength * Math.cos(theta_p_R)));
        let mag_p_L = 20 * Math.log10(Math.sqrt(1 + Math.pow(strength, 2) + 2 * strength * Math.cos(theta_p_L)));

        // --- 3. BINAURAL ILD (HEAD SHADOWING) ---
        // A simple empirical curve: max 20dB loss for shadowed ear, max 5dB boost for direct ear at high frequencies.
        let azim_rad = azim * Math.PI / 180;
        let f_shadow_weight = Math.min(freq / 3000, 1.0); // Shadowing mostly affects > 3kHz
        
        let ild_R = 0;
        let ild_L = 0;
        
        if (azim > 0) {
            // Source on Right
            ild_R = 5 * Math.sin(azim_rad) * f_shadow_weight;      // Pressure boost
            ild_L = -20 * Math.sin(azim_rad) * f_shadow_weight;    // Head shadow attenuation
        } else if (azim < 0) {
            // Source on Left
            ild_R = -20 * Math.abs(Math.sin(azim_rad)) * f_shadow_weight;
            ild_L = 5 * Math.abs(Math.sin(azim_rad)) * f_shadow_weight;
        }

        let mag_hrtf_R = mag_c + mag_cav + mag_ref + mag_p_R + ild_R;
        let mag_hrtf_L = mag_c + mag_cav + mag_ref + mag_p_L + ild_L;

        mag_total_R.push(mag_hrtf_R);
        mag_total_L.push(mag_hrtf_L);

        // --- 4. MIDDLE EAR CALCULATIONS (Symmetric) ---
        let w = 2 * Math.PI * freq;
        let Ct = (cav_vol_cm3 / 0.5) * 0.35e-6; 
        
        let Cp = 5.1e-6, La = 14e-3, Ra = 10, Rm = 390;
        let Rd1 = 200, Cd1 = 0.8e-6, Ld = 15e-3, Cd2 = 0.4e-6, Rd2 = 220, Rd3 = 5900, Cd3 = 0.2e-6;
        let Co = 1.4e-6, Lo = 40e-3, Ro = 70;
        let Cs = 0.25e-6, Rs = 3000;
        let Cc = 0.6e-6, Lc = 45e-3, Rc = 550;

        let z_cav_branch = Z_C(Cp, w).add(Z_L(La, w)).add(Z_R(Ra));
        let Z_cavity = parallel(parallel(z_cav_branch, Z_R(Rm)), Z_C(Ct, w));

        let z_d3 = parallel(Z_R(Rd3), Z_C(Cd3, w));
        let z_d2 = Z_C(Cd2, w).add(Z_R(Rd2));
        let z_drum_p = parallel(Z_L(Ld, w), z_d2.add(z_d3));
        let Z_eardrum_loss = Z_R(Rd1).add(Z_C(Cd1, w)).add(z_drum_p);

        let Z_ossicles = Z_C(Co, w).add(Z_L(Lo, w)).add(Z_R(Ro));
        let Z_joint = Z_C(Cs, w).add(Z_R(Rs));
        let Z_cochlea = Z_C(Cc, w).add(Z_L(Lc, w)).add(Z_R(Rc));

        let Z_load = parallel(Z_joint, Z_cochlea);
        let Z_branch2 = Z_ossicles.add(Z_load);
        let Z_total = Z_cavity.add(parallel(Z_eardrum_loss, Z_branch2));

        let V_branch2_ratio = parallel(Z_eardrum_loss, Z_branch2).div(Z_total);
        let V_cochlea_ratio = Z_load.div(Z_branch2);
        
        let H_middle = V_branch2_ratio.mul(V_cochlea_ratio);
        
        let mag_m = 20 * Math.log10(H_middle.mag()) + me_transformer_gain; 
        mag_middle.push(mag_m);

        // --- 5. FINAL BINAURAL COMBINATION ---
        mag_combined_R.push(mag_hrtf_R + mag_m);
        mag_combined_L.push(mag_hrtf_L + mag_m);
    }

    document.getElementById('stats_box').innerHTML = `
        <strong>Calculated Middle Ear Gain:</strong><br><br>
        • Areal Ratio Gain: ${areal_gain.toFixed(1)} dB<br>
        • Lever Ratio Gain (Malleus/Incus): ${lever_gain.toFixed(1)} dB<br>
        • <strong>Total Middle Ear Gain: ${me_transformer_gain.toFixed(1)} dB</strong><br><br>
        <em>Note: Move the Azimuth slider to observe binaural Head Shadowing (ILD) and Pinna Notch shifts!</em>
    `;

    // TRACES
    const traceLeftOuter = { x: f, y: mag_total_L, mode: 'lines', name: 'Left Outer (HRTF)', line: {color: 'rgba(52, 152, 219, 0.5)', width: 2, dash: 'dot'} };
    const traceRightOuter = { x: f, y: mag_total_R, mode: 'lines', name: 'Right Outer (HRTF)', line: {color: 'rgba(231, 76, 60, 0.5)', width: 2, dash: 'dot'} };
    const traceMiddle = { x: f, y: mag_middle, mode: 'lines', name: 'Middle Ear Only', line: {color: 'orange', width: 2} };
    
    const traceLeftCombined = { x: f, y: mag_combined_L, mode: 'lines', name: 'Left Ear (Combined)', line: {color: '#2980b9', width: 3} };
    const traceRightCombined = { x: f, y: mag_combined_R, mode: 'lines', name: 'Right Ear (Combined)', line: {color: '#c0392b', width: 3} };

    const layout = {
        title: 'Binaural Transfer Function (Left vs Right HRTF)',
        xaxis: { type: 'log', title: 'Frequency (Hz)', range: [2, Math.log10(20000)] },
        yaxis: { title: 'Magnitude (dB)', range: [-40, 60] },
        margin: { l: 50, r: 20, t: 50, b: 100 },
        hovermode: 'closest',
        legend: { 
            orientation: 'h', 
            yanchor: 'top', 
            y: -0.15, 
            xanchor: 'center', 
            x: 0.5 
        }
    };

    Plotly.newPlot('chart', [
        traceLeftCombined, 
        traceRightCombined, 
        traceLeftOuter,
        traceRightOuter,
        traceMiddle
    ], layout, {responsive: true});
}

document.querySelectorAll('input[type="range"]').forEach(slider => {
    slider.addEventListener('input', updateApp);
});

updateApp();
</script>

</body>
</html>
