<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outer Ear Acoustic Model</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px; }
        .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        .plot-area { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 2; min-width: 600px; }
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 0.9em; font-weight: bold; margin-bottom: 5px; }
        input[type="range"] { width: 100%; }
        h2 { margin-top: 0; font-size: 1.2em; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .stats { margin-top: 20px; padding: 15px; background: #eef2f5; border-radius: 6px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h2>Biological Parameters</h2>
        
        <div class="slider-group">
            <label>Canal Length (m) <span id="val_len">0.0250</span></label>
            <input type="range" id="s_len" min="0.015" max="0.035" step="0.001" value="0.025">
        </div>
        <div class="slider-group">
            <label>Canal Diameter (m) <span id="val_diam">0.0070</span></label>
            <input type="range" id="s_diam" min="0.005" max="0.012" step="0.0001" value="0.007">
        </div>
        <div class="slider-group">
            <label>Concha Volume (m³) <span id="val_vol">4.0e-6</span></label>
            <input type="range" id="s_vol" min="1e-6" max="10e-6" step="1e-7" value="4e-6">
        </div>
        <div class="slider-group">
            <label>Concha Aperture (m²) <span id="val_aper">3.5e-4</span></label>
            <input type="range" id="s_aper" min="1e-4" max="10e-4" step="1e-5" value="3.5e-4">
        </div>
        <div class="slider-group">
            <label>Concha Depth (m) <span id="val_cdepth">0.0150</span></label>
            <input type="range" id="s_cdepth" min="0.005" max="0.03" step="0.001" value="0.015">
        </div>
        
        <h2 style="margin-top: 30px;">Positional Parameters</h2>
        
        <div class="slider-group">
            <label>Reflector Depth (m) <span id="val_refgeom">0.0300</span></label>
            <input type="range" id="s_refgeom" min="0.01" max="0.06" step="0.001" value="0.03">
        </div>
        <div class="slider-group">
            <label>Pinna Base Path (m) <span id="val_path">0.0400</span></label>
            <input type="range" id="s_path" min="0.01" max="0.1" step="0.001" value="0.04">
        </div>
        <div class="slider-group">
            <label>Reflect Strength <span id="val_strength">0.60</span></label>
            <input type="range" id="s_strength" min="0.1" max="0.9" step="0.01" value="0.6">
        </div>
        <div class="slider-group">
            <label>Azimuth (deg) <span id="val_azim">0</span></label>
            <input type="range" id="s_azim" min="-90" max="90" step="1" value="0">
        </div>
        <div class="slider-group">
            <label>Elevation (deg) <span id="val_elev">0</span></label>
            <input type="range" id="s_elev" min="-45" max="90" step="1" value="0">
        </div>

        <div class="stats" id="stats_box">
            Loading physics data...
        </div>
    </div>

    <div class="plot-area">
        <div id="chart" style="width:100%; height:600px;"></div>
    </div>
</div>

<script>
    const C = 343.0; // Speed of sound

    // Generate log-spaced frequencies from 100 to 20000 Hz
    const numPoints = 500;
    const f = Array.from({length: numPoints}, (_, i) => 
        Math.pow(10, Math.log10(100) + i * (Math.log10(20000) - Math.log10(100)) / (numPoints - 1))
    );

    function updateApp() {
        // Get values from sliders
        const length = parseFloat(document.getElementById('s_len').value);
        const diam = parseFloat(document.getElementById('s_diam').value);
        const vol = parseFloat(document.getElementById('s_vol').value);
        const aper = parseFloat(document.getElementById('s_aper').value);
        const cdepth = parseFloat(document.getElementById('s_cdepth').value);
        const refgeom = parseFloat(document.getElementById('s_refgeom').value);
        const path = parseFloat(document.getElementById('s_path').value);
        const strength = parseFloat(document.getElementById('s_strength').value);
        const azim = parseFloat(document.getElementById('s_azim').value);
        const elev = parseFloat(document.getElementById('s_elev').value);

        // Update labels
        document.getElementById('val_len').innerText = length.toFixed(4);
        document.getElementById('val_diam').innerText = diam.toFixed(4);
        document.getElementById('val_vol').innerText = vol.toExponential(1);
        document.getElementById('val_aper').innerText = aper.toExponential(1);
        document.getElementById('val_cdepth').innerText = cdepth.toFixed(4);
        document.getElementById('val_refgeom').innerText = refgeom.toFixed(4);
        document.getElementById('val_path').innerText = path.toFixed(4);
        document.getElementById('val_strength').innerText = strength.toFixed(2);
        document.getElementById('val_azim').innerText = azim;
        document.getElementById('val_elev').innerText = elev;

        let mag_total = [], mag_canal = [], mag_cavity = [], mag_reflector = [], mag_pinna = [];
        let fh = 0;

        for (let i = 0; i < f.length; i++) {
            let freq = f[i];
            
            // 1. Ear Canal
            let k = 2 * Math.PI * freq / C;
            let damping = 0.2;
            let mag_c = 20 * Math.log10(1.0 / Math.sqrt(Math.pow(Math.cos(k * length), 2) + Math.pow(damping * Math.sin(k * length), 2)));
            mag_canal.push(mag_c);

            // 2. Concha Cavity
            let r = Math.sqrt(aper / Math.PI);
            let L_eff = cdepth + 0.85 * r;
            fh = (C / (2 * Math.PI)) * Math.sqrt(aper / (vol * L_eff));
            let w = freq / fh;
            let Q = 3.0;
            let mag_cav = 20 * Math.log10(1.0 + (1.5 / Math.sqrt(1 + Math.pow(Q, 2) * Math.pow(w - 1/w, 2))));
            mag_cavity.push(mag_cav);

            // 3. Concha Reflector
            let f_cut = C / refgeom;
            let mag_ref = 20 * Math.log10(1.0 + 1.5 * (Math.pow(freq, 2) / (Math.pow(f_cut, 2) + Math.pow(freq, 2))));
            mag_reflector.push(mag_ref);

            // 4. Pinna Reflections
            let angle_mod = 1.0 - 0.005 * elev + 0.002 * azim;
            let delay = (path * angle_mod) / C;
            // Using magnitude of complex exponential: |1 + r*e^(-j*theta)|
            let theta = -2 * Math.PI * freq * delay;
            let mag_p = 20 * Math.log10(Math.sqrt(1 + Math.pow(strength, 2) + 2 * strength * Math.cos(theta)));
            mag_pinna.push(mag_p);

            // Combine
            mag_total.push(mag_c + mag_cav + mag_ref + mag_p);
        }

        // Calculate Resonances for Stats Box
        let canal_res = C / (4 * length);
        let min_pinna_idx = mag_pinna.indexOf(Math.min(...mag_pinna));
        let notch_f = f[min_pinna_idx];

        document.getElementById('stats_box').innerHTML = `
            <strong>Calculated Resonances:</strong><br><br>
            • Ear Canal Peak: ${Math.round(canal_res)} Hz<br>
            • Concha Helmholtz: ${Math.round(fh)} Hz<br>
            • Primary Pinna Notch: ${Math.round(notch_f)} Hz
        `;

        // Draw Plotly Chart
        const traceTotal = { x: f, y: mag_total, mode: 'lines', name: 'Total Output', line: {color: 'black', width: 3} };
        const traceCanal = { x: f, y: mag_canal, mode: 'lines', name: 'Ear Canal', line: {color: 'blue'} };
        const traceCavity = { x: f, y: mag_cavity, mode: 'lines', name: 'Concha Cavity', line: {color: 'green'} };
        const traceReflector = { x: f, y: mag_reflector, mode: 'lines', name: 'Reflector', line: {color: 'red'} };
        const tracePinna = { x: f, y: mag_pinna, mode: 'lines', name: 'Pinna Notches', line: {color: 'magenta'} };

        const layout = {
            title: 'Outer Ear Transfer Function (HRTF Approx)',
            xaxis: { type: 'log', title: 'Frequency (Hz)', range: [2, Math.log10(20000)] },
            yaxis: { title: 'Magnitude (dB)', range: [-15, 30] },
            margin: { l: 50, r: 20, t: 50, b: 50 },
            hovermode: 'closest',
            legend: { x: 0.02, y: 0.98 }
        };

        Plotly.newPlot('chart', [traceTotal, traceCanal, traceCavity, traceReflector, tracePinna], layout, {responsive: true});
    }

    // Attach event listeners to all sliders
    document.querySelectorAll('input[type="range"]').forEach(slider => {
        slider.addEventListener('input', updateApp);
    });

    // Initial render
    updateApp();
</script>

</body>
</html>
